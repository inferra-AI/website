# The website on Inferra's own dev platform: every push to main builds site/
# with the Paketo web-servers buildpack (nginx) and serves a copy on dev,
# so changes can be checked there before GitHub Pages publishes inferralab.com.
version: 1
spaces:
  prod:
    branch: main
apps:
  website:
    path: ./
    port: 8080
    health: /
    build:
      env:
        BP_WEB_SERVER: nginx
        BP_WEB_SERVER_ROOT: site
