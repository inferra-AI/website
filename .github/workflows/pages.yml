# Publishes the public pre-launch page (public/) to GitHub Pages (inferralab.com).
# The full site (site/) runs only on the dev copy under inferralab.dev until launch;
# at launch, publish site/ here instead.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the public page
        run: |
          mkdir -p out
          cp -r public/. out/
          cp -r site/fonts site/favicon.svg site/og.png site/install.sh out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
